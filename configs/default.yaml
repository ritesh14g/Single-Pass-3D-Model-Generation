# SIH26158 / PS-17 — master configuration.
# Rule 3 of the build spec: no hard-coded parameters anywhere in code.
# Every number the pipeline depends on lives here. `fast.yaml` and
# `accurate.yaml` are thin overlays that deep-merge on top of this file.

preset: default

run:
  # Pipeline mode: "A" (classical only), "B" (feed-forward only),
  # "hybrid" (both, confidence-gated), "auto" (hybrid with automatic
  # fallback to A on any Track B failure). See spec §7.4.
  mode: auto
  # Root for per-run working directories; each run gets <workdir>/<run_id>/.
  workdir: data/interim
  outdir: data/outputs
  # Resume from an existing run directory instead of starting over (§2.4 rule 1).
  resume: true
  seed: 1337

device:
  # "cuda", "cpu", or "auto" (cuda when available, else cpu with a loud log line).
  prefer: auto
  # Total GPU memory the pipeline may assume, in GB. Chunk sizing reads this;
  # a visible card's real memory overrides it. 20 = the institute's H100 MIG
  # slice (CLOUD_GPU_GUIDE.md §2). The spec's reference card is 24.
  gpu_memory_gb: 20
  # Leave this much GPU memory free for concurrent stages (§7.2).
  gpu_headroom_gb: 4
  # FP16 inference for GPU models (YOLO now, VGGT later). Ignored on CPU.
  half_precision: true
  # OpenCV / torch thread pools. "auto" = the container's real CPU quota
  # (cgroup-aware), so a 3-core notebook doesn't run 100+ threads.
  cpu_threads: auto

# ---------------------------------------------------------------------------
# Stage 1 — Ingest (§4)
# ---------------------------------------------------------------------------
# Stage 0 — input check (src/preflight/). Runs before ingest and proves the input can
# produce every output; BLOCK stops the run (unless --accept-input), WARN is reported.
preflight:
  enabled: true
  # Stop the pipeline on a blocking problem. The CLI's --accept-input turns this off per run.
  block_on_fail: true
  # Correct a telemetry time offset measured from video motion vs GPS speed, when confident.
  apply_time_offset: true
  sampling:
    # Keyframes spread over the clip; a 10-minute 4K clip decodes in well under a minute.
    max_samples: 180
    width: 960
    min_gap_s: 1.0
    # Features are detected on a smaller copy; decoding and detection run on this many threads.
    feature_width: 640
    workers: 3
  video:
    # PS §1.3: drone video 1080p / 4K. Below 720p the input is refused.
    good_short_side_px: 1080
    min_short_side_px: 720
    good_fps: 24
    min_fps: 10
    min_duration_s: 5
    # PS §1.4: a 10-minute video in 15 minutes.
    max_duration_s: 600
    # Compressed bits per pixel per frame; drone originals are ~0.1-0.3, streams ~0.02.
    good_bits_per_pixel: 0.05
    min_bits_per_pixel: 0.02
  quality:
    # Variance of the Laplacian at the sampled width (960 px), below which a frame is blurred.
    blur_sharpness_floor: 25
    dark_brightness: 35
    overexposed_share: 0.25
    max_bad_exposure_share: 0.3
    min_keypoints: 150
    max_sky_share: 0.3
    overlay_min_share: 0.002
    letterbox_min_share: 0.02
  telemetry:
    # PS §1.3: GPS is mandatory. false = run scale-free with a warning instead of refusing.
    require_gps: true
    good_rate_hz: 5
    min_rate_hz: 0.9
    good_coverage: 0.95
    min_coverage: 0.7
    max_gap_s: 3.0
    max_speed_mps: 70
    # Speed is measured over this window, so a rounded 10 Hz log is not read as teleporting.
    speed_window_s: 1.0
    # Share of fixes on whole seconds that marks a 1 s timestamp resolution.
    whole_second_share: 0.9
  sync:
    # Video motion (image shift per second) vs GPS ground speed, over this many seconds of offset.
    max_search_s: 30
    step_s: 0.1
    min_points: 10
    good_corr: 0.6
    min_corr: 0.3
    # The peak must beat the 90th percentile of the correlation at offsets more than 3 s away;
    # an unrelated track correlates about equally well everywhere.
    min_peak_margin: 0.05
    # |offset| up to ok_lag_s passes; up to max_auto_lag_s is corrected; beyond that blocks.
    ok_lag_s: 0.5
    max_auto_lag_s: 5.0
    # A larger offset is accepted (not refused) when the video's recording time and the log's
    # clock say the same thing to within this many seconds.
    clock_agreement_s: 2.0
    # Timing is only measurable when the speed varies (coefficient of variation).
    min_speed_cv: 0.15
    hover_speed_mps: 0.5
    max_contradiction: 0.2
  authenticity:
    # Share of feature matches consistent with one rigid scene (fundamental matrix, 1.5 px).
    rigid_good: 0.6
    rigid_min: 0.35
    # The video's embedded location tag vs the GPS track.
    location_match_m: 300
    # Encoder / handler strings of editing and transcoding tools.
    reencoders: [Lavf, HandBrake, Adobe, Premiere, DaVinci, Resolve, CapCut, "Final Cut", iMovie, Shotcut,
                 Kdenlive, Filmora, x264, x265, VideoProc]
  feasibility:
    # Straight-line extent of the flight during the clip, below which there is no parallax.
    min_path_m: 20
    # Nadir ground sample distance above which <= 1 m accuracy is at risk.
    max_gsd_m: 0.3

ingest:
  video:
    # Try hardware decode first; fall back to software with a logged downgrade.
    hardware_decode: true
    # First rung of hardware decode: NVDEC via PyNvVideoCodec (GPU), then
    # OpenCV's hardware flag, then OpenCV software. Needs hardware_decode.
    nvdec: true
    # CUDA device index for NVDEC. Under MIG the slice is always 0.
    nvdec_gpu_id: 0
    # PyNvVideoCodec segfaults (uncatchable) instead of raising on inputs it cannot
    # seek, so NVDEC only gets inputs known to work; everything else decodes through
    # OpenCV with a logged downgrade. Matched as substrings of the codec name.
    # MPEG-2 TS killed Stage 2 on the box (S1-15).
    nvdec_codecs: [h264, hevc, h265, av1, vp9]
    nvdec_allow_ts: false
    # Frames are scored at this width before any expensive operation.
    scoring_width: 640
    # Working resolution the rest of the pipeline sees. null = native.
    max_width: null
  telemetry:
    # Search order for telemetry; first source that yields valid rows wins,
    # later sources fill missing columns only. See spec §4.2.
    # klv is first: STANAG 4609 metadata is multiplexed against the video's own
    # clock, so it needs no alignment search and is the most trustworthy source
    # when present. It is absent from DJI footage and falls through harmlessly.
    sources: [klv, srt, csv, exif]
    # Any telemetry file is accepted whatever its name or extension: the kind is sniffed from
    # its content (src/ingest/formats.py). Streams inside the video (KLV, DJI subtitle track,
    # GoPro GPMF) and sidecars (SRT, CSV/TXT, DJI flight record, GPX, KML, GeoJSON/JSON,
    # PX4 ULog, ArduPilot .bin, MAVLink .tlog) all land in the same canonical table.
    # Also look for a telemetry file with a different name in the video's folder (e.g. a DJI
    # "telemetry.csv"). Only when the folder holds exactly one video.
    scan_folder: true
    # Video time 0 corresponds to telemetry time `time_offset_s` (s). null = work it out:
    # per-frame sources are already on the video clock; flight logs use their recording flag,
    # else their UTC clock against the video's creation time (time-zone offsets removed).
    time_offset_s: null
    # A log's UTC clock and the video's creation time are matched after removing a whole
    # number of these (s): cameras often stamp local time labelled as UTC.
    timezone_step_s: 900
    # Largest leftover (s) after the time-zone step for the clocks to count as matching.
    clock_match_tolerance_s: 120
    # Flight logs covering the whole flight (motors on to off): the rows flagged as recording
    # pick the segment that matches the video.
    recording:
      columns: [CUSTOM.isVideo, isVideo, is_video, recording, isRecording, video_recording, camera_recording]
      true_values: [Recording, "true", "1", "yes", "on"]
      duration_tolerance_s: 3.0
      padding_s: 2.0
    # Accept a fix only if the reported horizontal accuracy is below this (m).
    # null disables the check (most DJI SRT variants do not report it).
    max_hdop: null
    klv:
      # MISB ST 0601 (STANAG 4609) telemetry carried inside the video stream —
      # the usual format for military-intelligence and disaster-response
      # imagery. Parsed by src/ingest/klv.py; needs neither ffmpeg nor klvdata.
      enabled: true
      # Sidecar files searched when the video itself is not a TS. A raw .klv is
      # what `ffmpeg -i in.ts -map 0:d -c copy out.klv` writes.
      sidecar_suffixes: [.klv, .ts]
      # Scan MP4/MOV for KLV samples. Off by default: a DJI MP4 never carries
      # KLV, and proving that costs a full read of a 4K file on every run. Turn
      # it on for MP4-wrapped ISR footage.
      scan_mp4: false
      # Reject the whole stream if any ST 0601 checksum (tag 1) fails. Off by
      # default because some encoders emit a wrong checksum while the rest of
      # the packet is sound; failures are counted and reported either way.
      require_checksum: false
      # Guard rail for very long recordings; ISR platforms emit ~30 packets/s.
      max_packets: 200000
    csv_column_map:
      # Canonical name -> list of accepted header spellings (case-insensitive,
      # matched after stripping non-alphanumerics). Extend, never hard-code.
      # Wall-clock columns first: they tie the log to the video's clock.
      t: [CUSTOM.updateTime, updateTime, datetime_utc, datetime(utc), gps_time_utc, time, timestamp, datetime,
          time_s, elapsed]
      lat: [lat, latitude, gpslatitude, osd_lat]
      lon: [lon, long, longitude, gpslongitude, osd_lon]
      # DJI/AirData: OSD.altitude is above sea level, OSD.height is above the takeoff point.
      alt_gps: [alt, altitude, gpsaltitude, osd_alt, altitude_msl, altitude_above_seaLevel(meters)]
      alt_baro: [baroalt, barometricaltitude, relativealtitude, osd_relalt, height, relative_height,
                 height_above_takeoff(meters)]
      roll: [roll, gimbalroll, osd_roll]
      pitch: [pitch, gimbalpitch, osd_pitch]
      yaw: [yaw, heading, gimbalyaw, osd_yaw]
      focal_mm: [focallength, focal, focal_mm]
    # A flight-log CSV/TXT with no header row (a bare numeric GPS dump) has
    # its columns assigned positionally in this order instead of guessed.
    headerless_column_order: [lat, lon, alt_gps]
    # Binary DJI flight records (DJIFlightRecord_*.txt from DJI GO / Pilot) are
    # accepted wherever a flight-log CSV/TXT is. Their clock is flight time, so
    # rows are re-based onto the recording that matches the video.
    flight_record:
      # "auto" = the recording whose duration matches the video; an integer
      # picks a recording by order in the log (0 = first).
      segment: auto
      # Flight time (s) at which the video starts; overrides `segment` when set.
      # Use it for clips that were trimmed after recording.
      offset_s: null
      # Largest |recording duration - video duration| accepted as a match (s).
      # Recording on/off is logged at 1 Hz, so each edge is known to ~1 s.
      duration_tolerance_s: 3.0
      # Telemetry kept either side of the recording, for interpolation (s).
      segment_padding_s: 2.0
  frame_selection:
    # Adaptive overlap targeting (§4.3) — not fixed-interval sampling.
    target_overlap: 0.75
    overlap_tolerance: 0.05
    # Guard rails so a bad flow estimate cannot explode or starve the frame set.
    min_stride_frames: 2
    max_stride_frames: 90
    # A frame count means different things at different frame rates: 90 frames
    # is 1.5 s at 60 fps but 3 s at 30 fps, so one cap cannot be right for both.
    # When set, these express the same guard rails in seconds and win over the
    # frame counts above (converted with the clip's own fps, then re-clamped to
    # at least min_stride_frames). Measured on a 1080p60 forward-oblique
    # inspection clip: at the 90-frame cap consecutive kept frames still
    # overlapped 0.997, because 90 frames is 1.5 s of a scene that barely moves
    # — the cap, not the estimator, was holding overlap above the §4.3 band.
    # null on either = fall back to the frame count.
    min_stride_seconds: null
    max_stride_seconds: 10.0
    min_frames: 20
    max_frames: 1200
    # Sparse optical flow used for the overlap estimate.
    # pyramid_levels must be deep enough that the expected displacement at the
    # coarsest level fits inside win_size/2: at 25% of a 640 px frame that is
    # 160 px, which needs 5 levels (160/2^5 = 5 px) to stay inside a 21 px
    # window. Too few levels does not degrade gracefully — LK reports success
    # on a wrong local minimum instead.
    flow:
      max_corners: 400
      quality_level: 0.01
      min_distance: 8
      win_size: 21
      pyramid_levels: 5
      # Photometric verification of the fitted inter-frame transform.
      # min_alignment_ncc: frames must actually match after alignment.
      min_alignment_ncc: 0.35
      # Aperture-problem guard: shifting the fitted transform by peak_probe_px
      # (at 640 px working width, scaled with frame width) along EACH axis must
      # lower the correlation by at least min_peak_drop. Content that is
      # invariant along the flight direction (a road or river the drone follows)
      # correlates equally well at any along-track offset, so its overlap cannot
      # be measured; measured on synthetic flights, true pairs drop >= 0.09 and
      # such false matches drop ~0.00.
      peak_probe_px: 4
      min_peak_drop: 0.03
      # Verification (NCC + peak test) runs on frames downscaled to this width.
      # Correlation is a global statistic; 320 px is ample and ~4x cheaper than
      # 640 px, which profiling showed was 43% of selection time.
      verify_width: 320
    # A stride may grow by at most this factor per stride search. Motion is
    # continuous, so a sudden 10x jump in stride is an estimator failure, not
    # the drone accelerating; this caps the damage if one slips through.
    max_stride_growth: 2.0
    # Bias selection toward I-frames when the container exposes frame types (§5.3).
    prefer_keyframes: true
    keyframe_search_radius: 3

# ---------------------------------------------------------------------------
# Stage 2 — Conditioning (§5)
# ---------------------------------------------------------------------------
condition:
  enabled: true
  blur:
    # Adaptive threshold, derived from the video's own variance-of-Laplacian
    # distribution. A frame is rejected when it is a robust outlier below the
    # typical sharpness of THIS video: below median - robust_sigma * a
    # MAD-derived sigma, or below the absolute floor.
    #
    # Note this is a deliberate refinement of spec §5.2, which specifies a
    # fixed percentile as the threshold. A fixed percentile rejects that
    # percentage of frames from every video, including one that is uniformly
    # sharp — spending coverage to remove frames that were never damaged. The
    # outlier formulation rejects what is genuinely anomalous instead, so a
    # clean video loses nothing and a video with a blurred tail loses the tail.
    robust_sigma: 3.0
    absolute_floor: 40.0
    # Sharpness is a property of the scene as much as of the camera: a stretch
    # of plain farmland scores lower than a built-up block while being perfectly
    # in focus. One whole-video threshold therefore reads a *content* change as
    # blur — measured on LineVision-VideoGeoTagging.mp4 it rejected 450
    # consecutive sharp frames over a pasture (issue S1-7, 63-72 s, score
    # median 1410 vs 2823 earlier in the same clip, anisotropy ~1.4 so not
    # motion smear). With this enabled each frame is compared with the frames
    # around it instead, so only a *local* dip counts as blur.
    #
    # What stops a genuinely blurred stretch from normalising itself: the
    # window adapts, but (a) `hard_floor_fraction` keeps an absolute line under
    # the whole-video median, and (b) real motion blur is caught by the
    # directional test below, which is a detection rather than a threshold and
    # is unaffected by the local baseline.
    rolling_baseline:
      enabled: true
      # Most recent evaluated frames the local level is measured over. Shorter
      # follows a change of scene sooner; longer is steadier against noise.
      window: 30
      # Below this many samples the whole-video profile is used as-is. Kept
      # small: until the window fills, a clip that *opens* on low-texture ground
      # is judged by the whole-video line, which is the S1-7 failure. A 40% ratio
      # test is stable on a median of a handful of frames.
      min_samples: 5
      # Reject a frame more than this fraction softer than the median of its
      # window. A ratio, because sharpness scales with scene texture: the S1-7
      # pasture stretch was 13% below the preceding frames and in focus, while
      # blur that destroys matching is a far larger drop (and motion smear is
      # caught by anisotropy regardless).
      max_local_drop: 0.4
      # A frame below this fraction of the whole-video median is unusable
      # however its neighbours score. 0.25 = four times softer than typical.
      hard_floor_fraction: 0.25
    # Coverage guard: never reject more than this fraction of frames, however
    # bad the footage. Past this point the problem is the whole video, and
    # reconstructing it badly with a warning beats reconstructing nothing.
    max_reject_fraction: 0.35
    # Above this percentile a frame is "clean"; between the reject threshold
    # and clean it is sharpened conservatively and down-weighted in fusion.
    clean_percentile: 50
    unsharp_amount: 0.6
    unsharp_radius: 1.5
    degraded_weight: 0.6
    # Directional (drone-jerk) blur is rejected harder than uniform softness.
    # Anisotropy above the limit is a positive detection of motion smear, not
    # merely a hint: a genuinely sharp frame has no preferred direction in its
    # spectrum. So a frame carrying that signature must be at least as sharp as
    # this percentile of the video to survive, rather than merely clearing the
    # outlier test. This matters because blurred and sharp frames can overlap
    # in sharpness score while being perfectly separated by anisotropy.
    directional:
      enabled: true
      fft_anisotropy_reject: 2.2
      strict_percentile: 50
    # Consecutive rejections beyond this raise a coverage warning for the segment.
    max_consecutive_rejects: 3
  artifacts:
    enabled: true
    block_sizes: [8, 16]
    # Blockiness score above this triggers correction + keypoint masking.
    blockiness_threshold: 1.35
    bilateral:
      diameter: 5
      sigma_color: 35
      sigma_space: 5
    # Reject keypoints within this many px of a detected block boundary.
    keypoint_exclusion_px: 2
  illumination:
    enabled: true
    exposure_chain:
      enabled: true
      # Gain/bias fitted on the overlapping region of consecutive frames.
      sample_stride: 4
      max_gain: 2.5
      min_gain: 0.4
      # Bias bound, in 8-bit luminance counts, applied symmetrically. The
      # transform is gain*pixel + bias, so an unbounded bias saturates a frame
      # to solid white however tightly the gain is clamped — which is exactly
      # what happened before this existed (S2-10). A genuine exposure offset
      # between adjacent frames is a few counts; 32 is generous.
      max_bias: 32.0
    clahe:
      enabled: true
      clip_limit: 2.0
      tile_grid: [8, 8]
    shadow:
      enabled: true
      # Shadow = elevated blue/red ratio AND low saturation AND not too bright.
      # The primary discriminator is the blue-ratio shift: sky-lit shadow is
      # bluer than direct-sun by a measurable amount even when the brightness
      # difference is small. blue_ratio_delta is the minimum shift above the
      # scene median required (fixes S2-2: the old fixed-percentile luminance cut
      # capped recall at the chosen percentile fraction of pixels).
      blue_ratio_delta: 0.12
      max_saturation: 0.45
      # Pixels whose value > median * luminance_ceiling_factor are excluded:
      # bright blue sky patches and specular highlights are not cast shadows.
      luminance_ceiling_factor: 1.05
      dilate_px: 5
      # Photo-consistency weight applied to shadow pixels during MVS.
      mvs_weight: 0.35
    low_light:
      # Mean luminance below this (0-1) marks the frame low-SNR.
      mean_luma_threshold: 0.22
      gamma: 0.65
      denoise_h: 7
      fusion_weight: 0.5
  dynamic:
    enabled: true
    # Primary: semantic segmentation. Falls back to geometric-only if the
    # model is unavailable (logged downgrade, never a crash).
    model: yolov8n-seg.pt
    classes: [person, bicycle, car, motorcycle, bus, truck, boat, bird, cat, dog, horse, sheep, cow]
    conf_threshold: 0.25
    dilate_px: 10
    geometric:
      enabled: true
      # Cross-view depth disagreement (relative) that marks a pixel dynamic.
      depth_disagreement: 0.12
      min_neighbour_views: 2
      # Only trust the geometric test in textured regions.
      min_texture_variance: 25.0
    hole_policy:
      # Masked terrain/road surrounded by confident geometry is filled at the
      # ground plane; everything else is flagged, not guessed (§5.5).
      fill_ground_plane: true
      max_fill_area_m2: 40.0
  gps:
    enabled: true
    # Platform envelope for outlier rejection (§5.6).
    max_speed_mps: 25.0
    max_accel_mps2: 8.0
    # Minimum time baseline for differentiating positions. Telemetry positions
    # are quantized (6 decimal places of latitude is ~0.11 m), and acceleration
    # goes as dx/dt^2, so differentiating adjacent 30 Hz samples turns that
    # quantum into ~100 m/s^2 of phantom acceleration on perfectly good data.
    envelope_min_baseline_s: 0.5
    # Assumed position quantization/noise floor, added to the envelope limits
    # so ordinary jitter is never mistaken for impossible motion.
    position_quantum_m: 0.2
    median_window: 5
    kalman:
      process_noise: 0.5
      measurement_noise_horizontal: 2.5
      measurement_noise_vertical: 5.0
    altitude:
      # Prefer barometric relative altitude; complementary-filter it against GPS.
      prefer_baro: true
      complementary_alpha: 0.97
    rtk:
      # When RTK/PPK fixes are detected, tighten GPS weight by this factor.
      weight_boost: 10.0
    huber_delta_m: 2.0

# ---------------------------------------------------------------------------
# Stage 3/4 — Reconstruction tracks (§7)
# ---------------------------------------------------------------------------
recon:
  track_a:
    # Classical baseline (§7.1): pycolmap SfM + dense, OpenMVS mesh + texture.
    # ODM was dropped (DEVLOG §4: needs a container runtime, CPU-bound on 3 cores).
    # GPU first: pycolmap-cuda12 runs SIFT, matching, BA and PatchMatch on CUDA;
    # without it SfM runs on CPU and dense falls back to OpenMVS DensifyPointCloud.
    camera_model: SIMPLE_RADIAL
    # Seed focal from telemetry HFOV and hold it fixed. On a constant-height nadir
    # flight images + GPS only fix height/focal; a refined focal drifted to -17%
    # height on Esri, the fixed one measured -4% (DEVLOG §4).
    focal_from_telemetry: true
    # Stage 2's dynamic-object masks keep features off moving objects.
    use_dynamic_masks: true
    sift:
      max_image_size: 1600
      max_num_features: 8192
    matching:
      sequential_overlap: 10
      quadratic_overlap: true
    mapper:
      # Hard cap on incremental mapping (0 = none); the budget ladder backs it up.
      max_runtime_s: 0
    gps_priors:
      # §7.3 / §8.1 step 4 (DEVLOG S4-1): estimate the GPS-to-video time lag from the SfM
      # cameras, then re-map with GPS positions as priors. Esri: residual 7.6 -> 3.4 m, camera
      # height wander 20 -> 6.4 m, lag -1.7 s (one clean minimum, stable across passes).
      enabled: true
      # auto = estimate; a number (s) forces it; 0 = trust the telemetry clock.
      time_offset: auto
      offset_search_s: 3.0
      offset_step_s: 0.05
      # Apply the estimated lag only if it cuts the horizontal RMS by at least this much.
      min_offset_improvement_pct: 10.0
      # Horizontal GPS carries the timing error; a level flight's altitude is known to its
      # quantisation (KLV 0.30 m). Esri: v 0.5 -> 4.1 m, v 0.3 -> 3.4 m; h 3/5/10 ~ equal.
      sigma_horizontal_m: 5.0
      sigma_vertical_m: 0.3
      # Regression gate (§7.3 step 6): keep the refined model only if the GPS error drops, the
      # mean reprojection error rises by no more than this fraction, and at most this many
      # frames fall out; otherwise keep the first pass and log why.
      reproj_tolerance: 0.25
      max_frames_lost: 2
    merge:
      # When SfM splits the flight into pieces (they share no images), place the smaller
      # pieces through GPS instead of dropping them (box, Esri: 42 of 50 frames kept of 2
      # pieces). The seam is only as good as the pieces' GPS fits.
      enabled: true
      min_gps_frames: 3
      # A piece whose own GPS fit is worse than this is dropped rather than misplaced.
      max_piece_gps_rms_m: 25.0
    dense:
      # Chosen by the S4-8 sweep on the box: keeps the geometric pass and all
      # frames; resolution sets detail (~15 cm/px on Esri at 1280).
      max_image_size: 1280
      src_images: 8
      iterations: 5
      window_step: 1
      geom_consistency: true
      # Dense on every Nth frame. 1 = all: halving frames lost 82-86% coverage (§4).
      every: 1
      fusion_min_num_pixels: 5
      # Projection for the budget: measured PatchMatch cost per frame at 1280 px
      # on the H100 2g.20gb slice, scaled by pixel count for other sizes.
      gpu_s_per_frame_at_1280: 13.6
      # CPU fallback (OpenMVS): 9.2 s/frame at 0.31 MP on an i5-1135G7, scaled to 1280x720.
      cpu_s_per_frame_at_1280: 27.0
      # Budget ladder for dense: step down through these sizes when the projection overruns.
      degrade_sizes: [960, 640]
      # Stage time kept back for fusion, meshing and texturing (box: 22 + 23 + 47 s on Esri).
      reserve_after_s: 120
    mesh:
      # openmvs (Delaunay) is the default: pycolmap-cuda12's Poisson shattered a
      # clean cloud on Linux (S4-6). poisson + cleaning is the fallback.
      mesher: openmvs
      # Hybrid only: reduce the mesh to this many faces per unique surface sample
      # (dense points / views per point). 0 = keep every face. Texturing time is ~linear in
      # faces (laptop, 3 threads: 105 s at 659k vs 49 s at 300k) and the reduced surface
      # stays within ~10 cm median / 21 cm 95% of the full one on Esri.
      hybrid_faces_per_sample: 2.0
      poisson_depth: 11
      min_component_fraction: 0.01
    texture:
      enabled: true
      export_type: obj
    openmvs:
      # auto = tools/openmvs/bin (Linux) or tools/openmvs/vc17/x64/Release (Windows).
      bin_dir: auto
  track_b:
    # Hybrid (§7.4 "Track B depth fills"): VGGT depth on Track A's SfM cameras, used by
    # run.mode auto / hybrid / B; mode A uses Track A dense instead. VGGT's own poses are
    # not used: they match COLMAP to 0.7 m over 8-frame windows but break beyond ~16
    # frames (90 m RMS at 32). Box, Esri: depth within 1.04% of COLMAP's 1920 px dense
    # (99.1% of pixels within 5%) in 5.9 s vs 1133 s (DEVLOG). Any failure falls back to
    # Track A dense with a logged downgrade.
    # vggt_omega (VGGT-Ω, default) or vggt (VGGT-1B). Box, Esri, vs COLMAP 1920 px depth:
    # Omega 24 cm/px, 0.86% median error (0.89 m), worst frame 1.13%, 9.7 s, 5.9 GB;
    # VGGT-1B 34 cm/px, 1.04% (1.07 m), worst 2.85%, 5.9 s, 8.5 GB. Omega is gated (FAIR
    # non-commercial research licence, LIC-1): without an approved Hugging Face login on the
    # machine, Track B falls back to VGGT-1B, logged.
    model: vggt_omega
    # VGGT-1B: CC-BY-NC-4.0, not gated.
    weights: facebook/VGGT-1B
    # git clone https://github.com/facebookresearch/vggt tools/vggt
    repo_dir: tools/vggt
    # VGGT on CPU is minutes per window; without CUDA the stage uses Track A dense.
    require_gpu: true
    window_frames: 8
    # VGGT input width in px (multiple of 14). Measured on the box (Esri, vs COLMAP 1920 px
    # depth): 518 -> 34 cm/px, 1.04% error (99.1% within 5%), 5.9 s; 700 -> 21 cm, 1.30%
    # (97.0%), 9.3 s; 1036 -> 13 cm, 2.49% (76.0%), 22.5 s. VGGT was trained at 518 and its
    # depth degrades beyond it, so finer sampling costs accuracy. Fine detail = preset accurate.
    input_width: 518
    # Share of least-confident VGGT pixels dropped per frame before fusion.
    drop_low_conf: 0.3
    anchor:
      # Per-frame depth scale from the Track A sparse points the frame observes.
      min_points: 10
      # Median |z_sparse / (s * z_vggt) - 1| above this rejects the frame (box median 0.85%).
      max_spread_pct: 5.0
    consistency:
      # A point is kept when its source view and this many more agree on its depth.
      neighbours: 3
      rel_tolerance: 0.03
      min_extra_views: 1
    # Fuse every Nth pixel of the 518-px depth maps.
    pixel_stride: 2
    # Per-frame scaled depth + confidence for Stage 3 zone classification.
    keep_confidence_maps: true
    omega:
      # git clone https://github.com/facebookresearch/vggt-omega tools/vggt_omega
      repo_dir: tools/vggt_omega
      weights_repo: facebook/VGGT-Omega
      checkpoint: vggt_omega_1b_512.pt
      # "balanced" sizing keeps ~(512/16)^2 = 1024 patches per frame: 688x384 on 16:9,
      # 1.3x finer than VGGT-1B at 518 while still at Omega's training size.
      image_resolution: 512
    # Measured on the H100 2g.20gb slice (window probe, box).
    gpu_s_per_frame: 0.13
  refine_ba:
    enabled: true
    max_iterations: 100
    time_budget_s: 180
    gps_prior_weight: 1.0
    huber_delta_px: 2.0
    # Spec §7.3 step 6: if post-BA reprojection error regresses, keep pre-BA.
    regression_gate: true
    regression_tolerance: 1.0

# ---------------------------------------------------------------------------
# Stage 3 — Occlusion / fusion engine (§6) — core innovation
# ---------------------------------------------------------------------------
fusion:
  zones:
    # Zone 1: well observed. Zone 2: thinly observed. Zone 3: never observed.
    zone1_min_views: 4
    zone1_min_triangulation_deg: 5.0
    zone2_min_views: 1
    # Voxel size is derived as this multiple of the ground sample distance.
    voxel_gsd_multiple: 2.0
    voxel_size_min_m: 0.02
    voxel_size_max_m: 1.0
  mono_depth:
    model: depth-anything-v2-small
    # Scale/shift solved on the Zone1 boundary band only, RANSAC-robust.
    anchor:
      boundary_band_px: 24
      ransac_iterations: 500
      ransac_inlier_threshold_m: 0.25
      min_inlier_ratio: 0.35
      # Fit residual above this -> refuse to fuse, reclassify as Zone 3.
      max_residual_m: 0.6
    blend_band_voxels: 3
  tsdf:
    truncation_voxels: 4.0
    # Zone 2 integration weight is always strictly below Zone 1's.
    zone1_weight: 1.0
    zone2_weight_max: 0.45
    min_weight_to_surface: 0.15
  poisson:
    depth: 10
    # Trim faces whose supporting sample density is below this quantile —
    # this is what stops Poisson silently hallucinating closed surfaces (§6.4).
    density_trim_quantile: 0.08
  gaps:
    min_area_m2: 1.0
    # Generate a clearly-marked inferred surface for Zone 3, or leave the hole.
    render_inferred: true
  plane_completion:
    # Stretch goal (§6.5) — off until the core pipeline is green.
    enabled: false
    ransac_distance_m: 0.05
    min_plane_points: 500

# ---------------------------------------------------------------------------
# Stage 5 — Geo-anchoring (§8.1)
# ---------------------------------------------------------------------------
geo:
  crs:
    # "auto" selects the UTM zone from the flight's mean longitude.
    target: auto
    geographic: EPSG:4326
  vertical:
    # GPS altitude is ellipsoidal; most deliverables want orthometric.
    geoid_model: EGM96
    output_datum: orthometric
    # Datum of the telemetry altitude. auto: KLV (MISB ST 0601 tag 15) is MSL/orthometric;
    # DJI SRT/CSV is taken as WGS84-ellipsoidal (spec §8.1) and flagged as assumed.
    gps_altitude_datum: auto
  similarity:
    ransac_iterations: 2000
    # Rejects gross GPS outliers only. Esri's residuals are 5-7 m and systematic (S4-1); a
    # 3 m cut would discard half the flight and flatter the RMS, which is reported over all
    # cameras anyway.
    inlier_threshold_m: 10.0
    min_cameras: 8
  gcp:
    # Optional. The system must work with zero GCPs (§8.1).
    file: null
    weight: 20.0

# ---------------------------------------------------------------------------
# Stage 5 — Export (§8.2)
# ---------------------------------------------------------------------------
export:
  formats: [obj, ply, las, geotiff, glb, fbx]
  # Confidence must survive export in every format that can carry it.
  carry_confidence: true
  # Confidence = confirming views / this, clipped to 1 (COLMAP's own points: median 4 views).
  confidence_full_views: 5
  # Coverage grid: share of the ground the cameras saw that the dense cloud covers.
  coverage_cell_m: 1.0
  texture_size: 8192
  raster:
    # auto = spacing of unique surface samples (Esri hybrid: ~0.5 m); a finer fixed value
    # leaves the DSM mostly holes. The orthophoto uses the same grid.
    dsm_resolution_m: auto
    # Fill gaps up to this many cells from the nearest valid cell; larger stay nodata.
    fill_max_cells: 3
    nodata: -9999.0
  las:
    point_format: 3
    scale: [0.001, 0.001, 0.001]
  glb:
    draco_compression: false
  fbx:
    # FBX is the most fragile export; OBJ -> headless Blender is the fallback.
    converter: auto        # auto | blender | fbxsdk
    blender_binary: null
  tiling:
    enabled: true
    tile_size_m: 100.0
    max_points_per_tile: 5000000

# ---------------------------------------------------------------------------
# Stage 6 — QA (§8.5)
# ---------------------------------------------------------------------------
qa:
  # Stage 2 (Conditioning) scorecard bands. A KPI that can only ever report
  # "info" cannot fail, and a scorecard that cannot fail cannot localise a
  # fault — these are the thresholds that let the Stage 2 card go amber or red.
  stage2:
    # Mean per-frame shadow coverage. A genuinely shadowed scene (late light,
    # urban canyon) can reach 0.3; past half the frame the likelier explanation
    # is the detector over-firing, and either way the illumination weights are
    # not trustworthy. Note this measures *coverage*, not correctness: telling
    # an over-detecting detector from a dark scene needs ground truth (S2-3).
    shadow_fraction_warn: 0.30
    shadow_fraction_fail: 0.50
    # Fraction of frames that took the low-light path. §5.4 records an accuracy
    # cost there, so a mostly-low-light clip is a degraded reconstruction.
    low_light_fraction_warn: 0.20
    low_light_fraction_fail: 0.50
    # Altitude provenance (§5.6). Relative-only altitude leaves the vertical
    # datum unknown, which breaks absolute georeferencing downstream silently.
    altitude_source_pass: [baro+gps_complementary]
    altitude_source_warn: [gps]
    # Fraction of the frame at or above 250/255, averaged over the run, and the
    # count of frames more than half blown. Measured on the conditioned image
    # that reconstruction reads, so unlike every other illumination band this
    # one asks whether the output survived the transforms at all.
    saturated_fraction_warn: 0.02
    saturated_fraction_fail: 0.10
    # Fraction of frames whose exposure transform hit a gain bound. A clamped
    # frame is one the chain could not correct, so this is the outcome measure;
    # gain_span saturates at the clamp width and reports the same number however
    # bad the underlying drift gets.
    exposure_clamped_fraction_warn: 0.10
    exposure_clamped_fraction_fail: 0.30
    # Bands that used to be hard-coded in src/qa/stage2_eval.py.
    gain_span_warn: 0.40
    gps_outlier_fraction_warn: 0.10
    gps_outlier_fraction_fail: 0.30
  # Stage 4 (Track A) scorecard bands, read by src/qa/stage4_eval.py.
  stage4:
    # Share of conditioned frames SfM registered, and how many pieces the flight split into.
    registered_fraction_pass: 0.90
    registered_fraction_warn: 0.70
    models_warn: 2
    reproj_px_pass: 1.5
    reproj_px_warn: 2.5
    track_length_pass: 3.0
    track_length_warn: 2.0
    # Camera-centre RMS against GPS after a similarity fit. PS §1.4: spatial accuracy <= 1 m.
    cam_vs_gps_rms_pass_m: 1.0
    cam_vs_gps_rms_warn_m: 5.0
    # Height above ground vs telemetry (KLV frame-centre elevation): the metric-scale check.
    height_error_pass_pct: 5.0
    height_error_warn_pct: 15.0
    # A clean surface has ~2 faces per vertex; ~1 means fragments (S4-6).
    faces_per_vertex_pass: 1.8
    faces_per_vertex_warn: 1.4
    # Track B hybrid: median disagreement between a frame's Track A points and its scaled
    # VGGT depth (box, Esri: 0.85%), and the share of frames whose depth was anchored.
    anchor_spread_pass_pct: 2.0
    anchor_spread_warn_pct: 5.0
    frames_anchored_pass: 0.90
    frames_anchored_warn: 0.70
  # Stage 5 (georeferencing + export) scorecard bands, read by src/qa/stage5_eval.py.
  stage5:
    cam_vs_gps_rms_pass_m: 1.0
    cam_vs_gps_rms_warn_m: 5.0
    inlier_fraction_pass: 0.90
    inlier_fraction_warn: 0.70
    # Share of the ground the cameras saw that the dense cloud covers (§1.4 "entire visible scene").
    coverage_pass_pct: 90.0
    coverage_warn_pct: 70.0
  metrics:
    cloud_to_cloud_max_dist_m: 5.0
    percentiles: [50, 95]
  degrade:
    severities: [light, moderate, severe]
    types: [motion_blur, compression, low_light, shadow, gps_noise, dynamic_objects]
  report:
    formats: [json, html]

# ---------------------------------------------------------------------------
# §9 — Performance budget. Enforced in code, not aspirational.
# ---------------------------------------------------------------------------
budget:
  enabled: true
  total_s: 900            # 15 minutes for a 10-minute video
  stages:
    preflight: 60
    ingest: 60
    condition: 120
    track_b: 120
    refine_ba: 180
    track_a_mvs: 240
    fusion: 120
    geo: 15
    export: 60
  # On overrun a stage degrades rather than blocking. Every degradation logged.
  degradation:
    enabled: true
    # Ordered ladder of concessions applied as the deadline approaches.
    ladder: [reduce_resolution, cap_iterations, reduce_frames, skip_optional]
    warn_at_fraction: 0.8

logging:
  level: INFO
  # Structured JSONL alongside human-readable console output.
  jsonl: true
  console_color: true
